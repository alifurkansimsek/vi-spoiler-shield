<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spoiler Kalkanı</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; overflow: hidden;
      background: radial-gradient(120% 70% at 50% 118%, rgba(255, 122, 61, .55) 0%, rgba(255, 63, 164, .32) 32%, rgba(18, 10, 32, 0) 62%), var(--night); }
    body::after { content: ""; position: fixed; left: 0; right: 0; bottom: 22vh; height: 1px; background: linear-gradient(90deg, transparent, rgba(255, 194, 71, .55), transparent); }
    .box { position: relative; z-index: 1; max-width: 470px; text-align: center; animation: in .6s var(--ease) both; }
    .box img { display: block; margin: 0 auto 22px; filter: drop-shadow(0 12px 28px rgba(255, 63, 164, .35)); }
    h1 { font-size: 52px; text-transform: uppercase; margin-bottom: 12px; }
    p { color: var(--ink-2); margin: 0 auto 26px; max-width: 40ch; }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .row .btn { min-height: 42px; padding: 0 18px; }
    @keyframes in { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="box" role="alert">
    <img src="logo.svg" alt="" width="84" height="84">
    <h1>Bu sayfa gizlendi</h1>
    <p>Bağlantı, henüz oynamadığın oyunla ilgili görünüyor. Sayfayı daha yüklenmeden durdurdum.</p>
    <div class="row">
      <button class="btn btn-primary" id="back"><svg class="icon"><use href="icons.svg#i-back"/></svg>Geri dön</button>
      <button class="btn" id="show">Yine de göster</button>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
